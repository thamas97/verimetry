[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "verimetry"
version = "1.0.0"
description = "Local-first, evidence-gated Windows Internals telemetry assurance with DSSE Ed25519 receipts"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<48"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
verimetry = "verimetry.cli:main"
[tool.setuptools.packages.find]
include = ["verimetry*"]
[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
