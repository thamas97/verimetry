name: Verimetry CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run full test suite (65 tests incl. golden DSSE vectors)
        run: pytest -v
      - name: Run synthetic Windows Internals demo suite
        run: python -m verimetry demo --suite internals --out ./ci-demo-internals
      - name: Run synthetic T1685 Disable or Modify Tools demo suite
        run: python -m verimetry demo --suite t1685 --out ./ci-demo-t1685
      - name: Verify golden DSSE v1 conformance vectors offline
        run: |
          python -m verimetry verify --receipt ./test_vectors/valid_receipt_v1.dsse.json --public ./test_vectors/test-signer.pub.pem --nonce verimetry-vector-nonce-2026-01
          python -m verimetry verify --receipt ./test_vectors/valid_compare_v1.dsse.json --public ./test_vectors/test-signer.pub.pem --nonce verimetry-compare-nonce-2026-01
      - name: Verify sample leave-behind comparison receipt offline
        run: python -m verimetry verify --receipt ./docs/sample-pack/sample-comparison-receipt.json --public ./docs/sample-pack/sample-signer.pub.pem
